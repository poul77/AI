jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./springdemoai  # <--- Change this to your subfolder name
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean package
